<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Báo cáo KPI phòng Kinh doanh Miền Nam</title>
<style>
/* Theme "Simplifica" (Power BI) — background #FFFFFF, foreground #062F4F, dataColors[0] #1025BA,
   good #7CBB00, neutral #FFBB00, bad #FE6868 / #B82601, visual radius 12, không viền.
   Lưới 8px; mọi visual đặt tuyệt đối trên canvas 1280×720 như Power BI. */
:root{
  --page:#EAEAEA; --bg:#FFFFFF; --panel:#F9F8F8; --panel-2:#F1F0EF;
  --ink:#062F4F; --muted:#5F6B6D; --faint:#999895; --line:#E6E5E4; --accent:#1025BA; --on-accent:#FFFFFF;
  --accent-tint:#C9CFF2; --band:#EEF0FB;
  --ok:#7CBB00; --warn:#FFBB00; --bad:#FE6868; --na:#BDBCBA;
  --ok-ink:#4E7A00; --warn-ink:#946700; --bad-ink:#B82601;
  --ok-soft:#EEF6DC; --bad-soft:#FFE7E5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#1b1b1b; } }
:root[data-theme="dark"]{ --page:#1b1b1b; }
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--page);color:var(--ink);font-family:'Segoe UI',wf_segoe-ui_normal,'Helvetica Neue',Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,select{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.viewport{width:100%;display:flex;justify-content:center;padding:16px 0}
.frame{position:relative}
.stage{width:1280px;height:720px;transform-origin:0 0;position:absolute;left:0;top:0;background:var(--bg);
  box-shadow:0 1px 3px rgba(6,47,79,.12),0 8px 24px rgba(6,47,79,.06)}

/* ---- Visual container (tương đương 1 visual Power BI) ---- */
.vis{position:absolute;border-radius:12px;background:var(--panel);overflow:hidden}
.vis.clear{background:transparent;overflow:visible}
.vis.shape{background:var(--panel)}
.stage.pbi .vis{outline:1px dashed rgba(16,37,186,.55);outline-offset:-1px}
.stage.pbi .vis::after{content:attr(data-pbi);position:absolute;left:6px;bottom:6px;z-index:9;font-size:10px;line-height:14px;
  background:var(--accent);color:#fff;padding:2px 6px;border-radius:4px;pointer-events:none;white-space:pre-line;max-width:calc(100% - 12px)}
.stage.pbi .vis.shape::after{bottom:auto;top:6px;left:auto;right:6px}

/* ---- Header ---- */
.ttl h1{margin:0;font-size:18px;line-height:24px;font-weight:600;letter-spacing:-.005em}
.ttl p{margin:6px 0 0;font-size:13px;line-height:18px;color:var(--muted)}
.ttl p b{color:var(--ink);font-weight:600}
.crumb{display:flex;align-items:center;gap:8px;font-size:18px;line-height:24px;font-weight:600;white-space:nowrap}
.crumb .sep{color:var(--faint);font-weight:400}
.crumb .lnk{font-weight:600}
.crumb select{font-size:16px;font-weight:600;border:0;border-radius:8px;background:var(--panel);padding:2px 8px;color:var(--ink);max-width:260px}
.back{width:32px;height:32px;border:0;border-radius:16px;background:var(--panel);color:var(--ink);font-size:18px;line-height:32px;cursor:pointer}
.back:hover{background:var(--band);color:var(--accent)}
.slc .lb{font-size:12px;color:var(--muted);margin:0 0 6px 2px}
.tiles{display:flex;gap:4px}
.tiles button{flex:1;border:0;border-radius:8px;background:var(--panel);color:var(--muted);font-size:12px;height:30px;cursor:pointer;white-space:nowrap;padding:0 6px}
.tiles button:hover{background:var(--band);color:var(--ink)}
.tiles button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.tgl{width:100%;height:30px;border:1px dashed var(--faint);border-radius:8px;background:transparent;color:var(--muted);font-size:11.5px;cursor:pointer}
.tgl[aria-pressed="true"]{border-style:solid;border-color:var(--accent);color:var(--accent);font-weight:600}

/* ---- Group labels (proximity + common region cho cụm KPI) ---- */
.grp{font-size:12px;font-weight:600;color:var(--muted);padding:0 2px 5px;border-bottom:2px solid var(--accent-tint);white-space:nowrap}

/* ---- Scope card ---- */
.scope{padding:14px 14px 12px}
.scope .a{font-size:14px;font-weight:600;line-height:18px}
.scope .b{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp{margin-top:12px}
.tp-t{height:4px;border-radius:2px;background:var(--line);position:relative}
.tp-t i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--ink)}
.tp-x{font-size:10.5px;color:var(--muted);margin-top:5px;white-space:nowrap}
.lgd{margin-top:14px;display:flex;gap:6px;white-space:nowrap;font-size:10px;color:var(--muted)}
.lgd span{display:flex;align-items:center;gap:6px}

/* ---- KPI card ---- */
.kc{padding:12px 10px 10px 12px;cursor:pointer;display:flex;flex-direction:column}
.kc:hover{background:var(--band)}
.kc.sel{background:var(--band)}
.kc.sel::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent)}
.kc .kn{font-size:12px;line-height:14px;font-weight:600;height:28px;overflow:hidden;padding-right:14px}
.kc .kv{font-size:24px;line-height:28px;font-weight:600;margin-top:6px;letter-spacing:-.01em}
.kc .ks{font-size:11px;line-height:14px;font-weight:600}
.kc .kf{font-size:11px;line-height:14px;color:var(--muted);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info{position:absolute;right:6px;top:8px;width:18px;height:18px;border:0;border-radius:9px;background:transparent;color:var(--faint);font-size:12px;line-height:18px;cursor:help;padding:0}
.info:hover,.info:focus-visible{color:var(--accent);background:var(--bg)}
.bullet{height:6px;border-radius:3px;background:var(--line);position:relative;margin-top:8px}
.bullet i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bullet b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}

/* ---- Matrix ---- */
.mtx{display:grid;height:100%}
.mh{font-size:11px;line-height:13px;font-weight:600;color:var(--muted);display:flex;align-items:flex-end;padding:0 10px 8px;border-bottom:1px solid var(--line)}
.mh.num{justify-content:flex-end;text-align:right}
.mr{display:flex;align-items:center;padding:0 10px;font-size:12.5px;border-bottom:1px solid var(--line);min-width:0}
.mr.last{border-bottom:0}
.mr.num{justify-content:flex-end}
.mr.band,.mh.band{background:var(--band)}
.mr.gs,.mh.gs{box-shadow:inset 2px 0 0 var(--bg)}
.mr.tot{background:var(--panel-2)}
.mh.grpH{align-items:center;padding-bottom:0;color:var(--ink);border-bottom:1px solid var(--line)}
.mr.dim{color:var(--muted)}
.mr.tot.band{background:#E4E7F7}
.rh{gap:8px;justify-content:space-between;cursor:pointer}
.rh .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh .sb{font-size:10.5px;color:var(--muted);font-weight:400}
.rh:hover .nm{color:var(--accent);text-decoration:underline}
.rh .cnt{font-size:10.5px;color:var(--muted);white-space:nowrap}
.cell{gap:6px;cursor:pointer}
.cell:hover{background:var(--band)}
.cell small{margin-left:auto;font-size:10.5px;color:var(--faint)}
.v-ok{font-weight:400}
.sq{width:8px;height:8px;border-radius:2px;flex:none;display:inline-block}
.st-ok{background:var(--ok)} .st-warn{background:var(--warn)} .st-bad{background:var(--bad)} .st-na{background:var(--na)}
.c-ok{color:var(--ok-ink)} .c-warn{color:var(--warn-ink)} .c-bad{color:var(--bad-ink)} .c-na{color:var(--faint)}

/* ---- Insight cards ---- */
.ins{padding:16px 16px 14px;display:flex;flex-direction:column;height:100%}
.ins .l{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ins .h{font-size:15px;line-height:20px;font-weight:600;margin-top:8px}
.ins .d{font-size:12px;line-height:17px;color:var(--muted);margin-top:6px}
.ins .d b{color:var(--ink);font-weight:600}
.ins .go{margin-top:auto;align-self:flex-start;border:0;background:none;padding:0;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer}
.ins .go:hover{text-decoration:underline}

/* ---- Detail panel ---- */
.dt{padding:16px 18px 0}
.dt .l{font-size:11.5px;color:var(--muted)}
.dt .h{font-size:15px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt .h span{font-weight:400;color:var(--muted);margin-left:6px}
.dt .f{font-size:11.5px;line-height:15px;color:var(--muted);margin-top:6px}
.cv{padding:4px 12px 0 18px}
.cv .ct{font-size:13px;font-weight:600;margin-bottom:2px}
.cv .cs{font-size:11px;color:var(--muted);margin-bottom:4px}
.tb{padding:4px 10px 10px 12px;height:100%;display:flex;flex-direction:column}
.tb .ct{font-size:13px;font-weight:600;margin:0 0 4px 6px;flex:none}
.tb .sc{overflow:auto;min-height:0;flex:1}
table.lst{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.lst th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:600;color:var(--muted);font-size:11px;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.lst td{padding:4.5px 6px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst tr:last-child td{border-bottom:0}
.lst .num{text-align:right}
.lst .dim{color:var(--muted)}
.lnk{border:0;background:none;padding:0;color:inherit;cursor:pointer;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnk:hover{color:var(--accent);text-decoration:underline}
.tag{display:inline-flex;align-items:center;gap:5px}
.empty{padding:16px 6px;color:var(--muted);font-size:12px}
.mx{border-collapse:separate;border-spacing:3px;font-size:11px;margin-top:4px}
.mx th{font-weight:400;color:var(--muted);padding:0 4px;text-align:right;white-space:nowrap}
.mx thead th{text-align:center;font-size:10px;line-height:12px;vertical-align:bottom;padding-bottom:3px}
.mx td{width:50px;height:24px;text-align:center;border-radius:5px;font-weight:600;background:var(--bg)}
.mx td.up{background:var(--ok-soft);color:var(--ok-ink)} .mx td.dn{background:var(--bad-soft);color:var(--bad-ink)}
.mx td.eq{color:var(--muted)} .mx td.z{color:transparent}
.mxn{font-size:11px;color:var(--muted);margin-top:8px;display:flex;gap:14px}
.mxn span{display:flex;align-items:center;gap:5px}

/* ---- Progress matrix (trang nhân viên) ---- */
.pg .mr{font-size:12.5px}
.pg .kname{font-weight:600;cursor:pointer}
.pg .kname:hover{color:var(--accent)}
.pg .rk small{color:var(--faint)}

/* ---- Customer page ---- */
.cc{padding:12px 10px 10px 12px;display:flex;flex-direction:column}
.cc .kn{font-size:12px;font-weight:600;line-height:14px;height:28px}
.cc .kv{font-size:16px;line-height:24px;font-weight:600;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .kf{font-size:11px;color:var(--muted);margin-top:auto}
.strip{display:flex;gap:6px;padding:4px 18px 0}
.strip .s{flex:1;display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:0}
.strip .s i{height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden}
.strip .s span{font-size:10.5px;color:var(--muted);text-align:center}
.strip .s.base span{color:var(--ink);font-weight:600}

/* ---- Tooltip (tooltip Power BI: nền trắng, chữ đen theo theme) ---- */
#tip{position:absolute;z-index:20;max-width:260px;background:#fff;color:#000;border-radius:8px;padding:10px 12px;font-size:11.5px;line-height:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.18);pointer-events:none;display:none}
#tip b{display:block;font-size:12px;margin-bottom:4px}
#tip .r{color:#5F6B6D;margin-top:6px}
svg text{font-family:inherit}

/* ===== Hành vi Power BI ===== */
.kc{cursor:default}
.kc:hover{background:var(--panel)}
.kc .info{opacity:0;transition:opacity .15s}
.kc:hover .info,.kc .info:focus-visible{opacity:1}
.vt{font-size:13.3px;font-weight:600;line-height:18px;padding:10px 12px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt small{font-weight:400;color:var(--muted);font-size:11.5px;margin-left:6px}
.hl{font-size:13px;line-height:20px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl b{color:var(--ink);font-weight:600}
/* matrix selection */
.mr.sel{background:#DDE2F8 !important}
.mr.dimsel{opacity:.55}
.rh{cursor:pointer}
.rh .nm{font-size:12px}
.cell{cursor:pointer}
/* buttons */
.pbtn{width:100%;height:100%;border:0;border-radius:6px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;cursor:pointer;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn:disabled{background:var(--line);color:var(--faint);cursor:not-allowed;font-weight:400}
.pbtn.ghost{background:transparent;color:var(--accent);text-align:left;padding:0}
.pbtn.ghost:hover{text-decoration:underline}
/* bookmark navigator */
.bmn .lb{font-size:11px;color:var(--muted);margin:0 0 5px 2px}
.bmn .g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.bmn button{height:26px;border:0;border-radius:6px;background:var(--bg);color:var(--muted);font-size:11px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.bmn button:hover{color:var(--ink)}
.bmn button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
/* chart */
.lg{display:flex;gap:14px;font-size:10.5px;color:var(--muted);padding:2px 12px 0 14px;height:16px;align-items:center}
.lg span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.lg i{display:inline-block}
svg .bar{cursor:pointer}
/* table */
.lst th.srt{cursor:pointer}
.lst th.srt:hover{color:var(--ink)}
.lst th .ar{font-size:9px;margin-left:3px}
.lst tr.rs{cursor:pointer}
.lst tr.rs:hover td{background:#F0F1F8}
.lst tr.on td{background:#DDE2F8}
.lst tr.off td{opacity:.55}
/* 1-row table styled as text */
.one{padding:0 4px;font-size:15px;font-weight:600;line-height:26px;cursor:pointer;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.one:hover{background:#F0F1F8}
.one.on{background:#DDE2F8}
/* segment strip matrix */
.sgm{display:grid;margin:8px 14px 0;border-radius:2px;overflow:hidden}
.sgm div{display:flex;align-items:center;justify-content:center;font-size:10.5px;height:28px;border-right:1px solid var(--bg);border-bottom:1px solid var(--bg);white-space:nowrap;overflow:hidden}
.sgm .hd{background:var(--panel-2);color:var(--muted);font-weight:600}
.sgm .hd.base{color:var(--ink)}
.sgm .rhd{justify-content:flex-start;padding-left:8px;background:var(--panel-2);font-weight:600;color:var(--muted)}
.sgm .cl{color:#fff;font-weight:600}
/* PBI tooltip & context menu */
#tip{position:absolute;z-index:30;min-width:140px;max-width:280px;background:#fff;color:#000;border-radius:4px;padding:8px 10px;font-size:11.5px;line-height:17px;
  box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none;display:none}
#tip .rw{display:flex;justify-content:space-between;gap:16px}
#tip .rw span{color:#000;opacity:.7}
#tip .rw b{font-weight:600}
#tip .tx{max-width:260px}
#ctx{position:absolute;z-index:40;background:#fff;color:#000;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.22);font-size:12px;padding:4px 0;min-width:190px;display:none}
#ctx .h{padding:5px 12px;color:#5F6B6D;font-size:11px}
#ctx button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 12px 6px 22px;cursor:pointer;font-size:12px;color:#000}
#ctx button:hover{background:#F0F1F8}

.mtx.big .mr{font-size:13px}
.mtx.big .rh .nm{font-size:12.5px}
.tgl{height:100%}
/* ===== In ấn: mỗi trang báo cáo = 1 trang giấy khổ 16:9 (13,33 × 7,5 in), như Export to PDF ===== */
@page{size:13.333in 7.5in;margin:0}
/* Ký hiệu trạng thái khác hình dạng: in đen trắng vẫn phân biệt được (● ▲ ◆) */
.sq.st-ok,.sq.st-na{border-radius:50%}
.sq.st-warn{width:10px;height:9px;border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.sq.st-bad{width:9px;height:9px;border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.ft1{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.ft2{font-size:10.5px;color:var(--faint);margin-top:4px}
.lgdf{display:flex;gap:14px}
.lgdf span{display:flex;align-items:center;gap:5px}
.tb .sc{overflow:hidden !important}
.vt small{font-size:11px}
/* ===== Bản in: A4 ngang, giữ nguyên bố cục canvas ===== */
@page{size:A4 landscape;margin:8mm}
@media print{
  html,body{background:#fff !important;height:auto;overflow:visible}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .viewport{padding:0;display:block}
  .frame{width:1280px !important;height:720px !important;overflow:hidden;zoom:.82}
  .stage{transform:none !important;box-shadow:none}
  .noprint,#tip,#ctx,#pbiT,.kc .info{display:none !important}
  .stage.pbi .vis{outline:none}
  .stage.pbi .vis::after{display:none}
}
.rolebar{max-width:1280px;margin:12px auto 0;display:flex;align-items:center;gap:10px;font-size:12px;color:#323130;flex-wrap:wrap;padding:0 16px}
.rolebar select{font-size:12px;padding:4px 8px;border:1px solid #C8C6C4;border-radius:4px;background:#fff;color:#323130}
.rolebar .asrole{background:#FFF4CE;border:1px solid #F2D675;border-radius:4px;padding:4px 10px}
.rolebar .rnote{color:#8A8886;margin-left:auto}
@media print{.rolebar{display:none !important}}

/* ===== Role bar (chỉ có trong prototype, tương đương View as / App audience) ===== */
.rolebar{max-width:1280px;margin:16px auto 0;display:flex;align-items:center;gap:12px;font-size:12px;color:#605E5C;padding:0 16px;flex-wrap:wrap}
.rolebar .rl{font-weight:600;color:#323130}
.rseg{display:flex;background:#fff;border-radius:8px;padding:3px;box-shadow:0 0 0 1px #E1DFDD}
.rseg button{border:0;background:transparent;border-radius:6px;padding:5px 14px;font-size:12px;color:#605E5C;cursor:pointer}
.rseg button[aria-pressed="true"]{background:#062F4F;color:#fff;font-weight:600}
.rolebar select{font-size:12px;padding:5px 10px;border:0;border-radius:8px;background:#fff;color:#323130;box-shadow:0 0 0 1px #E1DFDD}
.rolebar select:disabled{opacity:.45}
.rolebar .asrole{background:transparent;border:0;padding:0;color:#605E5C}
.rolebar .asrole b{color:#323130;font-weight:600}

/* ===== Spacing & elegance: lưới 8px, padding visual 16px ===== */
.ttl h1{font-size:19px;line-height:26px;font-weight:600}
.crumb{font-size:19px;line-height:26px}
.crumb .lnk{font-size:19px;font-weight:600;color:var(--accent)}
.hl{font-size:13px;line-height:22px}
.slc .lb{margin-bottom:8px}
.tiles{gap:6px}
.tiles button{height:30px;border-radius:8px}
.grp{font-size:11.5px;letter-spacing:.01em;padding:0 0 6px;border-bottom:2px solid var(--accent-tint)}
.kc{padding:14px 10px 12px 12px}
.kc .kn{font-size:12px;line-height:15px;height:30px;padding-right:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kc .ks{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc .kv{font-size:26px;line-height:30px;margin-top:4px}
.kc .ks{margin-top:1px}
.kc .bullet{margin-top:10px}
.kc .kf{margin-top:8px}

  {KPIKey:2,ThuTuHienThi:2,Ten:'Nâng hạng khách hàng',Ky:'quy',CongThuc:'Số KH có hạng tại ngày chốt cao hơn hạng cuối quý trước (snapshot RFM cuối tháng), chia cho target.'},
  {KPIKey:3,ThuTuHienThi:3,Ten:'Doanh thu KH mới',Ky:'nam',CongThuc:'Doanh thu từ 01/01 đến ngày chốt của khách hàng có đơn đầu tiên trong 2026, chia cho target.'},
  {KPIKey:4,ThuTuHienThi:4,Ten:'Dự án mới',Ky:'quy',CongThuc:'Số dự án ghi nhận lần đầu trong quý của KH chủ lực và KH tiềm năng, chia cho target.'},
  {KPIKey:5,ThuTuHienThi:5,Ten:'Sai số dự báo mã chủ lực',Ky:'quy',CongThuc:'Σ|thực tế − dự báo| / Σ dự báo trên các mã chủ lực, chỉ tính tháng đã khép sổ. Đạt khi ≤ 20%.'},
  {KPIKey:6,ThuTuHienThi:6,Ten:'Dự án có phản hồi của khách hàng',Ky:'quy',CongThuc:'Dự án gửi mẫu trong quý đã có khách hàng phản hồi kết quả (chuyển cho R&D), chia cho tổng dự án đã gửi mẫu.'},
];

// ---- Dim_Customer + Fact_Sales ----
const CUST_NAMES=['Thực phẩm An Khang','Nước giải khát Sao Mai','Bánh kẹo Minh Phát','Sữa Đồng Xanh','Kem Tuyết Sơn','Trà sữa Mây Hồng',
 'Bánh mì Hương Quê','Đồ uống Việt Hưng','Thạch dừa Xanh Lam','Mứt Phúc An','Bánh Nguyệt Cát','Siro Hoa Lan','Kẹo dẻo Bảy Màu',
 'Cà phê Đất Đỏ','Nước ép Nhiệt Đới','Bánh quy Gia Hòa','Sữa chua Mộc Lam','Chè Ngọc Trai','Rau câu Thiên Thanh','Snack Giòn Tan',
 'Kem que Tuổi Thơ','Ngũ cốc Hạt Vàng','Nước tăng lực Sóng Lớn','Bánh bông lan Mai Vàng','Trà thảo mộc Núi Xanh','Kẹo Hạnh Nhân',
 'Đồ hộp Phương Nam','Bánh pía Sóc Xanh','Sữa hạt Lúa Mới','Syrup Cửu Long','Bánh su Bông Tuyết','Kem tươi Phố Biển','Nước dừa Xứ Dừa',
 'Thực phẩm Bình Minh','Bánh tráng Gió Nam','Chè Hoa Sen','Sữa đậu nành Hạt Ngọc','Kẹo gừng Ấm Áp','Vang trái cây Đồi Hồng',
 'Nước ép Vườn Nhà','Pha chế Tân Tiến','Trà chanh Phố Nhỏ','Bánh flan Mộc Mạc','Bánh trung thu Trăng Vàng','Kem sữa Đồng Nội',
 'Sinh tố Mùa Hạ','Bánh dẻo Hoa Cau','Nước mía Đồng Quê','Trà đào Gió Mát','Sữa bắp Nắng Mai','Thạch Biển Xanh','Bánh gạo Hạt Ngọc',
 'Kẹo sữa Bến Nghé','Siro Trái Cây Việt','Kem dừa Sông Tiền','Bánh cuộn Mây Trắng'];
const PROVINCES=['TP.HCM','TP.HCM','TP.HCM','Bình Dương','Đồng Nai','Long An','Cần Thơ','Tây Ninh','Bà Rịa - Vũng Tàu'];
const PREFIX=['Cty TNHH','Cty CP','Cơ sở'];
const DIM_CUSTOMER=[], PROFILE={}, FACT_SALES=[];
let ck=101, nameIx=0, hd=1;
const M_FIRST=mi(2025,7), M_LAST=mi(2026,9);
for(const e of SALES){
  for(const role of ['chuluc','chuluc','bigspender','regular','regular','new','new','new']){
    const k=ck++;
    const c={CustomerKey:k,MaKH:'KH'+(1000+k),TenKH:pick(PREFIX)+' '+CUST_NAMES[nameIx++%CUST_NAMES.length],NhomKH:'Thường',NhomTiemNang:null,
      NgayDonDauTien:null,EmployeeKey_PhuTrach:e.EmployeeKey,TinhThanh:pick(PROVINCES)};
    const p={role,up:null,down:null,start:M_FIRST};
    const oldDate=()=>dk(randi(2020,2024),randi(1,12),randi(1,28));
    const month2026=()=>mi(2026,randi(1,8));
    if(role==='chuluc'){c.NhomKH='Chủ lực';p.base=rand(110e6,190e6);p.p=.93;c.NgayDonDauTien=oldDate();if(R()<.25)p.down=month2026();}
    if(role==='bigspender'){c.NhomKH='Chủ lực';p.base=rand(330e6,470e6);p.p=.38;c.NgayDonDauTien=oldDate();if(R()<.65){p.up=month2026();p.pUp=1;}}
    if(role==='regular'){p.base=rand(22e6,60e6);p.p=rand(.5,.8);c.NgayDonDauTien=oldDate();
      const r=R(); if(r<.4){p.up=month2026();p.pUp=.97;} else if(r<.55)p.down=month2026();}
    if(role==='new'){c.NhomKH='Tiềm năng';c.NhomTiemNang=pick(['Nhóm 1','Nhóm 2','Nhóm 2','Nhóm 3']);p.base=rand(18e6,85e6);p.p=.8;p.start=mi(2026,randi(1,8));}
    DIM_CUSTOMER.push(c); PROFILE[k]=p;
  }
}
const CUS=Object.fromEntries(DIM_CUSTOMER.map(c=>[c.CustomerKey,c]));
for(const c of DIM_CUSTOMER){
  const p=PROFILE[c.CustomerKey], sim=SIM[c.EmployeeKey_PhuTrach];
  for(let i=Math.max(M_FIRST,p.start);i<=M_LAST;i++){
    const y=miY(i), m=miM(i);
    let prob=p.p;
    if(p.up!==null&&i>=p.up) prob=p.pUp;
    if(p.down!==null&&i>=p.down) prob=.3;
    if(p.role==='new'&&i===p.start) prob=1;
    if(R()>=prob) continue;
    const date=dk(y,m,i===M_LAST?randi(1,25):randi(1,28));
    let amt=p.base*rand(.75,1.25)*(p.up!==null&&i>=p.up?1.3:1);
    if(y===2026&&p.role!=='new') amt*=sim.g[qOfMonth(m)];
    if(p.role==='new') amt*=Math.min(1,.5+.15*(i-p.start));
    const so='HD'+String(yOf(date)).slice(2)+'-'+String(hd++).padStart(5,'0');
    const n=randi(1,3), ws=Array.from({length:n},()=>rand(.5,1.5)), wsum=ws.reduce((a,b)=>a+b,0), used=new Set();
    for(let j=0;j<n;j++){
      let prod; do{prod=(j===0&&R()<.75)?pick(KEY_PRODUCTS):pick(R()<.3?KEY_PRODUCTS:OTHER_PRODUCTS)}while(used.has(prod.ProductKey)); used.add(prod.ProductKey);
      const qty=Math.max(5,Math.round(amt*ws[j]/wsum/prod.GiaBan));
      FACT_SALES.push({SalesLineID:900000+FACT_SALES.length+1,SoHD:so,DateKey:date,CustomerKey:c.CustomerKey,ProductKey:prod.ProductKey,
        EmployeeKey:c.EmployeeKey_PhuTrach,SoLuong:qty,DoanhThu:qty*prod.GiaBan});
    }
    if(p.role==='new'&&!c.NgayDonDauTien) c.NgayDonDauTien=date;
  }
}

// ---- Fact_CustomerSegment: snapshot RFM cuối mỗi tháng, cửa sổ 6 tháng ----
const buyMonths={}, monthRev={};
for(const s of FACT_SALES){const i=miOf(s.DateKey);(buyMonths[s.CustomerKey]??=new Set()).add(i);monthRev[s.CustomerKey+'_'+i]=(monthRev[s.CustomerKey+'_'+i]||0)+s.DoanhThu}
function classify(Rv,F,M){if(Rv>=3)return 5;if(Rv<=1&&F>=5&&M>=600e6)return 1;if(F>=4)return 2;if(M>=600e6)return 3;return 4}
const FACT_CUSTOMER_SEGMENT=[], SEG_IDX={};
for(let i=mi(2025,12);i<=M_LAST;i++){
  const key=meKey(i);
  for(const c of DIM_CUSTOMER){
    if(!c.NgayDonDauTien||c.NgayDonDauTien>key) continue;
    const bm=[...(buyMonths[c.CustomerKey]||[])].filter(x=>x<=i);
    const Rv=bm.length?i-Math.max(...bm):9, win=bm.filter(x=>x>i-6);
    const M=win.reduce((a,x)=>a+(monthRev[c.CustomerKey+'_'+x]||0),0);
    const row={SnapshotID:FACT_CUSTOMER_SEGMENT.length+1,CustomerKey:c.CustomerKey,SnapshotDateKey:key,R:Rv,F:win.length,M,
      SegmentKey:classify(Rv,win.length,M),EmployeeKey:c.EmployeeKey_PhuTrach};
    FACT_CUSTOMER_SEGMENT.push(row); SEG_IDX[c.CustomerKey+'_'+key]=row;
  }
}

// ---- Fact_Project ----
const FACT_PROJECT=[]; let pj=1;
for(const e of SALES){
  const sim=SIM[e.EmployeeKey], mine=DIM_CUSTOMER.filter(c=>c.EmployeeKey_PhuTrach===e.EmployeeKey);
  const good=mine.filter(c=>c.NhomKH!=='Thường'), other=mine.filter(c=>c.NhomKH==='Thường');
  const mk=gn=>{
    const c=R()<.82?pick(good):pick(other);
    let gm=addDays(gn,randi(6,20)); if(gm>DATA_END) gm=null;
    let ph=null; if(gm&&R()<sim.rd){ph=addDays(gm,randi(4,16)); if(ph>DATA_END) ph=null;}
    FACT_PROJECT.push({ProjectKey:7000+pj,MaDuAn:'DA26-'+String(pj++).padStart(3,'0'),CustomerKey:c.CustomerKey,EmployeeKey:e.EmployeeKey,
      DateKey_GhiNhan:gn,DateKey_GuiMau:gm,DateKey_KHPhanHoi:ph,KetQuaPhanHoi:ph?pick(['Đạt','Đạt','Cần chỉnh mẫu','Không đạt']):null});
  };
  mk(dk(2025,12,randi(1,20)));
  for(const Q of QS){
    const last=Math.min(Q.end,DATA_END), n=Math.max(2,sim.np+randi(-1,1));
    for(let i=0;i<n;i++) mk(addDays(Q.start,randi(0,diffDays(Q.start,last))));
  }
}
FACT_PROJECT.sort((a,b)=>a.DateKey_GhiNhan-b.DateKey_GhiNhan).forEach((p,i)=>{p.MaDuAn='DA26-'+String(i+1).padStart(3,'0')});

// ---- Fact_Forecast (mã chủ lực × tháng × nhân viên) ----
const QTY={};
for(const s of FACT_SALES){const k=s.EmployeeKey+'_'+s.ProductKey+'_'+miOf(s.DateKey);QTY[k]=(QTY[k]||0)+s.SoLuong}
const qtyOf=(e,p,i)=>QTY[e+'_'+p+'_'+i]||0;
const FACT_FORECAST=[];
for(const e of SALES) for(const p of KEY_PRODUCTS) for(let i=mi(2026,1);i<=M_LAST;i++){
  let a=qtyOf(e.EmployeeKey,p.ProductKey,i); if(!isClosed(i)) a=a*30/25;
  if(a===0) continue;
  const err=Math.max(-.7,gauss()*SIM[e.EmployeeKey].fc);
  FACT_FORECAST.push({ForecastID:FACT_FORECAST.length+1,MonthKey:dk(miY(i),miM(i),1),ProductKey:p.ProductKey,EmployeeKey:e.EmployeeKey,SL_DuBao:Math.round(a*(1+err))});
}

// ---- Fact_KPITarget (nhân viên × KPI × quý) ----
const roundTo=(v,s)=>Math.max(s,Math.round(v/s)*s);
const isExisting=c=>c.NgayDonDauTien&&c.NgayDonDauTien<Y_START;
const isNew=c=>c.NgayDonDauTien&&c.NgayDonDauTien>=Y_START;
const sumSales=(e,from,to,f)=>FACT_SALES.reduce((a,s)=>(s.EmployeeKey===e&&s.DateKey>=from&&s.DateKey<=to&&f(CUS[s.CustomerKey]))?a+s.DoanhThu:a,0);
const FACT_KPITARGET=[];
for(const Q of QS) for(const e of SALES){
  const k=e.EmployeeKey;
  let qa=sumSales(k,Q.start,Math.min(Q.end,20260831),isExisting); if(Q.end>20260831) qa*=1.5;
  let ytd=sumSales(k,Y_START,Math.min(Q.end,20260831),isNew); if(Q.end>20260831) ytd*=9/8;
  const t={1:roundTo(qa*rand(.88,1.15),50e6),2:randi(2,3),3:roundTo(ytd*rand(.92,1.2),50e6),4:randi(4,5),5:.2,6:1};
  for(const kp of DIM_KPI) FACT_KPITARGET.push({TargetID:FACT_KPITARGET.length+1,EmployeeKey:k,KPIKey:kp.KPIKey,QuarterKey:2026*10+Q.id,GiaTriTarget:t[kp.KPIKey]});
}
const targetOf=(e,kpi,Q)=>FACT_KPITARGET.reduce((a,t)=>(t.KPIKey===kpi&&t.QuarterKey===2026*10+Q.id&&(e==='all'||t.EmployeeKey===e))?a+t.GiaTriTarget:a,0);

/* =====================================================================
   2. TẦNG TÍNH KPI (thay cho ETL sinh Fact_KPIResult)
   ===================================================================== */
const inScope=(e,x)=>e==='all'||x.EmployeeKey===e;
const timeProg=(kpi,Q,C)=>DIM_KPI[kpi-1].Ky==='nam'
  ?(diffDays(Y_START,C)+1)/(diffDays(Y_START,Q.end)+1):(diffDays(Q.start,C)+1)/(diffDays(Q.start,Q.end)+1);

function segmentChanges(e,Q,C){
  const out=[];
  for(const now of FACT_CUSTOMER_SEGMENT){
    if(now.SnapshotDateKey!==C||!inScope(e,now)) continue;
    const base=SEG_IDX[now.CustomerKey+'_'+Q.base]; if(!base) continue;
    const d=SEG[base.SegmentKey].ThuHang-SEG[now.SegmentKey].ThuHang;
    out.push({CustomerKey:now.CustomerKey,EmployeeKey:now.EmployeeKey,From:base.SegmentKey,To:now.SegmentKey,HuongThayDoi:d>0?'Nâng hạng':d<0?'Hạ hạng':'Giữ hạng',M:now.M,F:now.F});
  }
  return out;
}
function wapeMonths(e,months,prod){
  let n=0,d=0;
  for(const f of FACT_FORECAST){
    const i=miOf(f.MonthKey);
    if(!inScope(e,f)||!months.includes(i)||(prod&&f.ProductKey!==prod)) continue;
    n+=Math.abs(qtyOf(f.EmployeeKey,f.ProductKey,i)-f.SL_DuBao); d+=f.SL_DuBao;
  }
  return d?n/d:null;
}
const closedMonths=(Q,cutI)=>Q.months.filter(i=>i<=cutI&&isClosed(i));
function kpiActual(kpi,e,Q,C){
  switch(kpi){
    case 1: return FACT_SALES.reduce((a,s)=>(inScope(e,s)&&s.DateKey>=Q.start&&s.DateKey<=C&&isExisting(CUS[s.CustomerKey]))?a+s.DoanhThu:a,0);
    case 2: return segmentChanges(e,Q,C).filter(x=>x.HuongThayDoi==='Nâng hạng').length;
    case 3: return FACT_SALES.reduce((a,s)=>(inScope(e,s)&&s.DateKey>=Y_START&&s.DateKey<=C&&isNew(CUS[s.CustomerKey]))?a+s.DoanhThu:a,0);
    case 4: return FACT_PROJECT.filter(p=>inScope(e,p)&&p.DateKey_GhiNhan>=Q.start&&p.DateKey_GhiNhan<=C&&CUS[p.CustomerKey].NhomKH!=='Thường').length;
    case 5: return wapeMonths(e,closedMonths(Q,miOf(C)));
    case 6: {const sent=FACT_PROJECT.filter(p=>inScope(e,p)&&p.DateKey_GuiMau&&p.DateKey_GuiMau>=Q.start&&p.DateKey_GuiMau<=C);
             const back=sent.filter(p=>p.DateKey_KHPhanHoi&&p.DateKey_KHPhanHoi<=C);
             return {n:back.length,d:sent.length,v:sent.length?back.length/sent.length:null};}
  }
}
const CACHE=new Map();
function kpiResult(kpi,e,Q,cutI){
  const key=kpi+'|'+e+'|'+Q.id+'|'+cutI; if(CACHE.has(key)) return CACHE.get(key);
  const C=meKey(cutI), tp=timeProg(kpi,Q,C), T=targetOf(e,kpi,Q), a=kpiActual(kpi,e,Q,C);
  const r={kpi,e,Q,cutI,C,tp,target:T};
  if(kpi<=4){
    r.actual=a; r.ratio=T?a/T:0; const pace=r.ratio/tp;
    if(C>=Q.end){r.st=r.ratio>=1?'ok':r.ratio>=.85?'warn':'bad';r.label={ok:'Đạt',warn:'Gần đạt',bad:'Không đạt'}[r.st];}
    else{r.st=(r.ratio>=1||pace>=1)?'ok':pace>=.85?'warn':'bad';r.label={ok:'Đúng tiến độ',warn:'Cần chú ý',bad:'Chậm tiến độ'}[r.st];} r.big=pct(r.ratio); r.score=r.ratio;
  } else if(kpi===5){
    r.actual=a; r.target=.2;
    if(a===null){r.st='na';r.label='Chưa khép sổ';r.big='–';r.score=-Infinity}
    else{r.st=a<=.2?'ok':a<=.25?'warn':'bad';r.label={ok:'Đạt',warn:'Sát ngưỡng',bad:'Không đạt'}[r.st];r.big=pct(a,1);r.score=-a}
  } else {
    r.actual=a.v; r.n=a.n; r.d=a.d; r.target=1;
    if(a.v===null){r.st='na';r.label='Chưa phát sinh';r.big='–';r.score=-Infinity}
    else{r.st=a.v>=.95?'ok':a.v>=.8?'warn':'bad';r.label={ok:'Đạt',warn:'Cần chú ý',bad:'Không đạt'}[r.st];r.big=pct(a.v);r.score=a.v}
  }
  CACHE.set(key,r); return r;
}
function rankOf(kpi,e,Q,cutI){
  const arr=SALES.map(s=>kpiResult(kpi,s.EmployeeKey,Q,cutI)).sort((a,b)=>b.score-a.score);
  const me=kpiResult(kpi,e,Q,cutI); if(me.score===-Infinity) return null;
  return arr.findIndex(r=>r.score===me.score)+1;
}

   3. HIỂN THỊ — mô phỏng hành vi Power BI:
   - Mỗi khối V() = 1 visual, toạ độ tuyệt đối trên canvas 1280×720
   - Bấm điểm dữ liệu = chọn (cross-filter theo "Edit interactions"), bấm lại hoặc bấm nền = bỏ chọn
   - Chuyển trang có ngữ cảnh chỉ bằng Drillthrough (chuột phải hoặc nút Drillthrough khi đã chọn)
   - Phần chi tiết theo KPI = Bookmark navigator (bookmark KHÔNG lưu Data)

function pct(x,d=0){return (x*100).toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d})+'%'}
function money(v){return v>=1e9?(v/1e9).toLocaleString('vi-VN',{maximumFractionDigits:2})+' tỷ':Math.round(v/1e6).toLocaleString('vi-VN')+' tr'}
const num=v=>Math.round(v).toLocaleString('vi-VN');
const dd=k=>k?String(k%100).padStart(2,'0')+'/'+String(mOf(k)).padStart(2,'0'):'';
const ddmmyyyy=k=>dd(k)+'/'+yOf(k);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dot=(st,t)=>`<span class="tag"><i class="sq st-${st}"></i>${t}</span>`;
const tt=pairs=>esc(pairs.map(p=>p.join('::')).join('||'));

const BM_NAME={1:'Doanh thu KH hiện có',2:'Nâng hạng khách hàng',3:'Doanh thu KH mới',4:'Dự án mới',5:'Sai số dự báo',6:'Phản hồi của khách hàng'};
const ORDER=[...DIM_KPI].sort((a,b)=>a.ThuTuHienThi-b.ThuTuHienThi).map(k=>k.KPIKey);
const SEGCOL={1:'#1025BA',2:'#0375B4',3:'#008F95',4:'#3599B8',5:'#FB8281'};
const L=24, RH=150, LW=812, CW=(LW-RH)/6, RX=L+LW+16, RW=404;
const colX=i=>L+RH+i*CW;
const Y={grp:180,card:180,cardH:148,mtx:340,foot:664};

const state={ov:null,role:'mgr',page:'dept',q:3,cut:mi(2026,8),cutSel:mi(2026,8),emp:null,cust:null,bm:null,pbi:false,hist:[],sel:{},sort:{}};
const curQ=()=>QS[state.q-1], C_=()=>meKey(state.cut);
const R_=(k,e)=>kpiResult(k,e,curQ(),state.cut);
// Phạm vi mà các visual đang bị lọc: trang 1 lọc theo dòng được chọn trong Matrix, trang 2 theo drillthrough
const isMgr=()=>state.role==='mgr';
const rootLabel=()=>isMgr()?'Toàn phòng':'Tổng quan';
// RLS: nhân viên chỉ thấy dòng của mình, trưởng phòng thấy cả phòng (kể cả dòng tổng hợp EmployeeKey 0)
const scopeE=()=>state.page==='emp'?state.emp:!isMgr()?state.role:(state.sel.src==='matrix'&&state.sel.emp&&state.sel.emp!=='all'?state.sel.emp:'all');

function V(o){
  const tag=`${o.pbi}${o.it?'\n'+o.it:''}\nx ${o.x}, y ${o.y}, ${o.w}×${o.h}`;
  return `<div class="vis ${o.cls||''}" style="left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px" data-pbi="${esc(tag)}" ${o.attrs||''}>${o.inner}</div>`;
}

const ICON={

/* ---------- Line and clustered column chart ---------- */
function combo({keys,labels,cols,lines,fmt,max,W,H,selIdx,tips,cap}){
  const pl=42,pr=12,pt=20,pb=22,iw=W-pl-pr,ih=H-pt-pb;
  const all=[...cols.values,...lines.flatMap(l=>l.values)].filter(v=>v!=null);
  const raw=max||Math.max(1e-9,...all)*1.12;
  const b10=Math.pow(10,Math.floor(Math.log10(raw/4))), step=[1,1.5,2,2.5,3,4,5,6,8,10].map(c=>c*b10).find(s=>s*4>=raw), mx=step*4;
  const y=v=>pt+ih-(v/mx)*ih, bw=Math.min(34,iw/labels.length*.55), cx=i=>pl+iw*(i+.5)/labels.length;
  let g='';
  for(let i=0;i<=4;i++){const v=mx*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#D9D9D9" stroke-dasharray="1 3"/><text x="${pl-6}" y="${y(v)+3.5}" text-anchor="end" font-size="9.5" fill="#605E5C">${fmt(v)}</text>`}
  labels.forEach((l,i)=>{
    const v=cols.values[i], op=selIdx==null||selIdx===i?1:.4;
    if(v!=null){g+=`<rect class="bar" data-cm="${keys[i]}" data-tt="${tips(i)}" x="${cx(i)-bw/2}" y="${y(v)}" width="${bw}" height="${Math.max(1,pt+ih-y(v))}" fill="${cols.colors[i]}" opacity="${op}"/>`;
      if(labels.length<=9) g+=`<text x="${cx(i)}" y="${y(v)-5}" text-anchor="middle" font-size="9.5" font-weight="600" fill="#252423" opacity="${op}" pointer-events="none">${fmt(v)}</text>`}
    g+=`<text x="${cx(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#605E5C">${l}</text>`;
  });
  for(const ln of lines){
    const pts=ln.values.map((v,i)=>v==null?null:[cx(i),y(v)]);
    const seg=[];let cur=[];pts.forEach(p=>{if(p)cur.push(p);else{if(cur.length)seg.push(cur);cur=[]}});if(cur.length)seg.push(cur);
    if(ln.flat){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(ln.values.find(v=>v!=null))}" y2="${y(ln.values.find(v=>v!=null))}" stroke="${ln.color}" stroke-width="1.5" pointer-events="none" ${ln.dash?'stroke-dasharray="4 3"':''}/>`;continue}
    for(const s of seg) g+=`<polyline points="${s.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${ln.color}" stroke-width="1.5" pointer-events="none" ${ln.dash?'stroke-dasharray="4 3"':''}/>`;
    if(ln.markers) pts.forEach(p=>{if(p)g+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="${ln.color}" pointer-events="none"/>`});
  }
  const lg=`<div class="lg"><span><i style="width:9px;height:9px;background:${cols.legendColor||'var(--ok)'}"></i>${cols.name}</span>${lines.map(l=>`<span><i style="width:14px;border-top:2px ${l.dash?'dashed':'solid'} ${l.color}"></i>${l.name}</span>`).join('')}</div>`;
  return (cap?`<div class="lgc">${cap}</div>`:lg)+`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Biểu đồ">${g}</svg>`;
}
const stPace=(ratio,tp)=>{const p=ratio/tp;return (ratio>=1||p>=1)?'ok':p>=.85?'warn':'bad'};

  // KPI 2: bookmark này hiện Matrix chuyển hạng thay cho biểu đồ

  return {t:'Ma trận chuyển hạng',body:t,pbi:'Matrix (nền theo điều kiện)'};

    return {n:rows.length,t:(k===1?'Khách hàng hiện có':'Khách hàng mới 2026')+mTxt,h:tbl('t'+k,cols,rows,'Không có dữ liệu.',{top:TOP,cust,tip:r=>tt([['Khách hàng',CUS[r.c].TenKH],['Doanh thu',money(r.DT)]])})};
  }
  if(k===2){
    const rows=segmentChanges(e,Q,C).filter(x=>x.HuongThayDoi!=='Giữ hạng').sort((a,b)=>(a.HuongThayDoi<b.HuongThayDoi?1:-1)||SEG[a.To].ThuHang-SEG[b.To].ThuHang);

      {h:'Thay đổi',w:'56%',f:r=>dot(r.HuongThayDoi==='Nâng hạng'?'ok':'bad',`${SEG[r.From].TenHang} → ${SEG[r.To].TenHang}`),s:r=>SEG[r.To].ThuHang}],rows,'Chưa có khách hàng đổi hạng.',{top:TOP,cust})};
  }
  if(k===4){
    const rows=FACT_PROJECT.filter(p=>inScope(e,p)&&p.DateKey_GhiNhan>=Q.start&&p.DateKey_GhiNhan<=C&&inM(p.DateKey_GhiNhan));
    return {n:rows.length,t:'Dự án ghi nhận trong quý'+mTxt,h:tbl('t4',[{h:'Dự án',w:'19%',f:r=>r.MaDuAn,s:r=>r.MaDuAn},{h:'Khách hàng',w:'42%',f:r=>CUS[r.CustomerKey].TenKH,s:r=>CUS[r.CustomerKey].TenKH},
      {h:'Ghi nhận',w:'16%',num:true,f:r=>dd(r.DateKey_GhiNhan),s:r=>r.DateKey_GhiNhan},
      {h:'Tính KPI',w:'23%',f:r=>CUS[r.CustomerKey].NhomKH!=='Thường'?dot('ok','Có'):dot('na','Không'),s:r=>CUS[r.CustomerKey].NhomKH!=='Thường'?1:0}],rows,'Không có dự án.',{top:TOP,cust})};
  }
  if(k===5){
    const months=closedMonths(Q,state.cut).filter(i=>m==null||i===m), rows=[];
    for(const p of KEY_PRODUCTS){const fs=FACT_FORECAST.filter(f=>inScope(e,f)&&f.ProductKey===p.ProductKey&&months.includes(miOf(f.MonthKey)));
      if(!fs.length) continue; const F=fs.reduce((a,f)=>a+f.SL_DuBao,0), A=fs.reduce((a,f)=>a+qtyOf(f.EmployeeKey,f.ProductKey,miOf(f.MonthKey)),0), err=wapeMonths(e,months,p.ProductKey);
      rows.push({p,F,A,err,st:err<=.2?'ok':err<=.25?'warn':'bad'})}
    return {n:rows.length,t:'Mã chủ lực'+mTxt,h:tbl('t5',[{h:'Mã hàng',w:'30%',f:r=>r.p.MaSP,s:r=>r.p.MaSP},{h:'Dự báo (kg)',w:'23%',num:true,f:r=>num(r.F),s:r=>r.F},{h:'Thực tế (kg)',w:'23%',num:true,f:r=>num(r.A),s:r=>r.A},
      {h:'Sai số',w:'24%',num:true,f:r=>r.st==='ok'?pct(r.err,1):`<span class="c-${r.st}">${pct(r.err,1)}</span>`,s:r=>r.err}],rows,'Chưa có tháng khép sổ.')};
  }
  const rows=FACT_PROJECT.filter(p=>inScope(e,p)&&p.DateKey_GuiMau&&p.DateKey_GuiMau>=Q.start&&p.DateKey_GuiMau<=C&&inM(p.DateKey_GuiMau))
    .map(p=>({...p,done:!!(p.DateKey_KHPhanHoi&&p.DateKey_KHPhanHoi<=C)})).sort((a,b)=>(a.done-b.done)||a.DateKey_GuiMau-b.DateKey_GuiMau);
  return {n:rows.length,t:'Dự án đã gửi mẫu'+mTxt,h:tbl('t6',[{h:'Khách hàng',w:'42%',f:r=>CUS[r.CustomerKey].TenKH,s:r=>CUS[r.CustomerKey].TenKH},
    {h:'Gửi mẫu',w:'16%',num:true,f:r=>dd(r.DateKey_GuiMau),s:r=>r.DateKey_GuiMau},
    {h:'KH phản hồi',w:'42%',f:r=>r.done?`<span class="dim">${dd(r.DateKey_KHPhanHoi)}: ${r.KetQuaPhanHoi}</span>`:dot('bad','Chờ '+diffDays(r.DateKey_GuiMau,C)+' ngày'),s:r=>r.done?1:0}],rows,'Không có dự án.',{top:TOP,cust,tip:r=>tt([['Mã dự án',r.MaDuAn],['Khách hàng',CUS[r.CustomerKey].TenKH],['Gửi mẫu',ddmmyyyy(r.DateKey_GuiMau)],['KH phản hồi',r.done?ddmmyyyy(r.DateKey_KHPhanHoi)+', '+r.KetQuaPhanHoi:'Chưa có']])})};
}

/* ---------- Vùng chi tiết, trạng thái mặc định: Tổng quan 6 chỉ số (bookmark mặc định) ---------- */
function sparkSVG(vals,W=86,H=18){
  const pts=vals.map((v,i)=>v==null?null:[4+i*(W-8)/Math.max(1,vals.length-1),v]).filter(Boolean);
  if(!pts.length) return '';
  const lo=Math.min(.5,...pts.map(p=>p[1])), hi=Math.max(1.3,...pts.map(p=>p[1]));
  const y=v=>H-3-(v-lo)/(hi-lo)*(H-6), last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><line x1="2" x2="${W-2}" y1="${y(1)}" y2="${y(1)}" stroke="#C9CDD3" stroke-dasharray="2 2"/>`+
    `<polyline points="${pts.map(p=>p[0]+','+y(p[1])).join(' ')}" fill="none" stroke="#062F4F" stroke-width="1.5"/>`+
    `<circle cx="${last[0]}" cy="${y(last[1])}" r="2.6" fill="#062F4F"/></svg>`;
}

  }
  return h;

/* ---------- Insight cards ---------- */
function severity(r){if(r.st==='na')return 9;if(r.kpi<=4)return r.ratio/r.tp;if(r.kpi===5)return .2/r.actual;return r.actual}
function empIssues(e){
  const Q=curQ(),C=C_(),left=Math.max(0,diffDays(C,Q.end));
  return ORDER.map(k=>R_(k,e)).filter(r=>r.st==='bad'||r.st==='warn').sort((a,b)=>severity(a)-severity(b)).map(r=>{
    const n=DIM_KPI[r.kpi-1].Ten;let d;
    if(r.kpi<=4){const gap=Math.max(0,r.target-r.actual);d=`Đạt <b>${r.big}</b>, còn thiếu <b>${r.kpi===1||r.kpi===3?money(gap):gap+(r.kpi===2?' khách hàng':' dự án')}</b>${left?` trong ${left} ngày còn lại.`:'.'}`}
    else if(r.kpi===5) d=`Sai số <b>${r.big}</b>, vượt ngưỡng 20%.`;
    else d=`<b>${r.d-r.n}</b> dự án đã gửi mẫu chưa có phản hồi của khách hàng.`;
    return {st:r.st,l:r.label,h:n,d};
  });
}

function footer(pageName){

function conclusion(rs,label){
  const ok=rs.filter(r=>r.st==='ok').length;
  const worst=[...rs].filter(r=>r.st==='bad'||r.st==='warn').sort((a,b)=>severity(a)-severity(b))[0];
  return {h1:`${label}: ${ok}/6 chỉ số đạt hoặc đúng tiến độ`,
    sub:worst?`Cần tập trung nhất: <b>${DIM_KPI[worst.kpi-1].Ten}</b> (${worst.big}, ${worst.label.toLowerCase()}).`:'Mọi chỉ số đang đạt hoặc đúng tiến độ.'};
}

  if(ri>=0) h+=V({pbi:'Shape: dải hàng',it:'Bật/tắt theo bookmark',x:L,y:Math.round(Y.mtx+tH+hH+ri*rH),w:LW,h:Math.round(rH),cls:'clear',inner:'<div style="height:100%;background:var(--band)"></div>'});
  let m=`<div class="t2" style="padding:16px 16px 0">Tiến độ theo tháng chốt</div><div class="hint">Lũy kế tại từng ngày chốt. Bấm vào thẻ chỉ số phía trên để xem chi tiết ở bên phải.</div>
    <div class="mtx pg big" style="height:${MH-tH-8}px;margin-top:${tH-54}px;grid-template-columns:300px 110px repeat(3,1fr) 96px;grid-template-rows:${hH}px repeat(6,${rH}px)">`;
  m+=`<div class="mh">Chỉ số</div><div class="mh num">Target</div>`+Q.months.map(i=>`<div class="mh num">Đến ${dd(meKey(i))}</div>`).join('')+`<div class="mh num">Hạng</div>`;
  ORDER.forEach((k,j)=>{
    const lastc=j===5?'last':'';
    const tg=k===1||k===3?money(targetOf(e,k,Q)):k===5?'≤ 20%':k===6?'100%':targetOf(e,k,Q);
    m+=`<div class="mr ${lastc}">${DIM_KPI[k-1].Ten}</div><div class="mr num dim ${lastc}">${tg}</div>`;
    for(const i of Q.months){
      if(i>state.cut||i>M_LAST){m+=`<div class="mr num c-na ${lastc}">–</div>`;continue}
      const r=kpiResult(k,e,Q,i);
      m+=`<div class="mr num ${lastc}" data-tt="${tt([['Chỉ số',DIM_KPI[k-1].Ten],['Đến ngày',dd(meKey(i))],['Kết quả',r.big],['Trạng thái',r.label]])}">${r.st==='ok'?r.big:r.st==='na'?'<span class="c-na">–</span>':`<span class="tag"><i class="sq st-${r.st}"></i><span class="c-${r.st}">${r.big}</span></span>`}</div>`;
    }
    const rk=e==='all'?null:rankOf(k,e,Q,state.cut);
    m+=`<div class="mr num ${lastc}" data-tt="${tt([['Hạng trong phòng',rk?rk+' / '+SALES.length:'–']])}">${rk?`${rk} / ${SALES.length}`:'–'}</div>`;
  });
  m+='</div>';
  h+=V({pbi:'Matrix (nền trong suốt)',it:'Hàng: Dim_KPI. Cột: Dim_Cutoff. Hạng: cột tính sẵn ở ETL',x:L,y:Y.mtx,w:LW,h:MH,cls:'clear',inner:m});
  h+=detailArea(e,inter)+footer(isMgr()?'Trang KPI nhân viên':'Trang Báo cáo KPI của tôi');
  return h;
}

/* ---------- TRANG 3: Hồ sơ khách hàng (drillthrough, ẩn) ---------- */
function pageCust(){
  const Q=curQ(),C=C_(),c=CUS[state.cust],E=EMP[c.EmployeeKey_PhuTrach];
  const now=SEG_IDX[c.CustomerKey+'_'+C], base=SEG_IDX[c.CustomerKey+'_'+Q.base];
  const move=now&&base?SEG[base.SegmentKey].ThuHang-SEG[now.SegmentKey].ThuHang:0;
  const crumbs=isMgr()?[{t:'Toàn phòng Kinh doanh Miền Nam',go:'dept'},{t:E.TenNV},{t:c.TenKH}]:[{t:'Báo cáo KPI của tôi',go:'dept'},{t:c.TenKH}];
  const h1=now?`${c.TenKH.replace(/^(Cty TNHH|Cty CP|Cơ sở) /,'')}: hạng ${SEG[now.SegmentKey].TenHang}`:c.TenKH;
  const sub=`Phụ trách: <b>${E.TenNV}</b>. ${base&&now?(move>0?`Đã nâng từ ${SEG[base.SegmentKey].TenHang} so với đầu quý.`:move<0?`Đã hạ từ ${SEG[base.SegmentKey].TenHang} so với đầu quý.`:'Giữ hạng so với đầu quý.'):'Chưa đủ dữ liệu so sánh với đầu quý.'}`;
  let h=headerHTML({crumbs,h1,sub,inter:'Lọc bởi drillthrough'});
  h+=V({pbi:'Card (new): measure văn bản',x:L,y:Y.card,w:RH-12,h:Y.cardH,cls:'scope',inner:`<div class="a" style="line-height:17px">${c.TenKH}</div>
    <div class="b" style="margin-top:6px">${c.MaKH}, ${c.TinhThanh}</div><div class="b">Nhóm: ${c.NhomKH}${c.NhomTiemNang?' ('+c.NhomTiemNang+')':''}</div>
    <div class="b">Đơn đầu: ${c.NgayDonDauTien?ddmmyyyy(c.NgayDonDauTien):'–'}</div>`});
  const projQ=FACT_PROJECT.filter(p=>p.CustomerKey===c.CustomerKey&&p.DateKey_GhiNhan>=Q.start&&p.DateKey_GhiNhan<=C);
  const cards=[
    {n:'Hạng hiện tại',v:now?`<span style="color:${SEGCOL[now.SegmentKey]}">${SEG[now.SegmentKey].TenHang}</span>`:'–',f:`Tại ${dd(C)}`},
    {n:'Hạng đầu quý',v:base?SEG[base.SegmentKey].TenHang:'Chưa có',f:move>0?'<span class="c-ok">Đã nâng hạng</span>':move<0?'<span class="c-bad">Đã hạ hạng</span>':`Tại ${dd(Q.base)}`},
    {n:'Hành động gợi ý',v:`<span style="font-size:12px;font-weight:600;white-space:normal;line-height:15px;display:block">${now?SEG[now.SegmentKey].HanhDong:'–'}</span>`,f:''},
    {n:'Doanh thu 6 tháng',v:now?money(now.M):'–',f:'Cửa sổ RFM'},
    {n:'Số tháng có mua',v:now?`${now.F}/6`:'–',f:'6 tháng gần nhất'},
    {n:'Dự án trong quý',v:projQ.length,f:`${projQ.filter(p=>p.DateKey_KHPhanHoi&&p.DateKey_KHPhanHoi<=C).length} đã có KH phản hồi`},
  ];
  cards.forEach((cd,i)=>{const first=i===0||i===3,last=i===2||i===5;
    h+=V({pbi:'Card (new)',x:slot(i).x,y:Y.card,w:slot(i).w,h:Y.cardH,cls:'cc',
      inner:`<div class="kn">${cd.n}</div><div class="kv" ${i===2?'style="white-space:normal;overflow:visible"':''}>${cd.v}</div><div class="kf">${cd.f}</div>`})});
  const ms=[];for(let i=M_FIRST;i<=state.cut;i++)ms.push(i);
  const vals=ms.map(i=>monthRev[c.CustomerKey+'_'+i]||0), selM=state.sel.src==='chart'?state.sel.month:null;
  const lab=i=>miM(i)+'/'+String(miY(i)).slice(2);
  h+=V({pbi:'Clustered column chart',it:'Màu cột: fx theo quý. Bấm cột: lọc chéo bảng Hóa đơn',x:L,y:Y.mtx,w:LW,h:172,
    inner:`<div class="t2" style="padding:16px 16px 0">Doanh thu theo tháng</div>`+combo({keys:ms,labels:ms.map(lab),cols:{name:`Tháng thuộc ${Q.short}`,legendColor:'var(--accent)',values:vals,colors:ms.map(i=>Q.months.includes(i)?'var(--accent)':'#C9CED6')},lines:[],
      fmt:money,W:LW-16,H:112,selIdx:selM==null?null:ms.indexOf(selM),tips:j=>tt([['Tháng',lab(ms[j])],['Doanh thu',money(vals[j])]])})});
  const snaps=[];for(let i=mi(2025,12);i<=state.cut;i++)snaps.push(i);
  let sg=`<div class="sgm" style="grid-template-columns:70px repeat(${snaps.length},1fr)"><div class="hd rhd">Tháng</div>`+snaps.map(i=>`<div class="hd">${lab(i)}</div>`).join('');
  sg+=`<div class="rhd">Hạng</div>`+snaps.map(i=>{const s=SEG_IDX[c.CustomerKey+'_'+meKey(i)];
    return `<div class="cl" style="background:${s?SEGCOL[s.SegmentKey]:'var(--line)'}" data-tt="${tt([['Tháng',lab(i)],['Hạng',s?SEG[s.SegmentKey].TenHang:'Chưa có'],['R / F',s?s.R+' / '+s.F:'–'],['Doanh thu 6 tháng',s?money(s.M):'–']])}">${s?SEG[s.SegmentKey].TenHang:''}</div>`}).join('')+
    `<div class="rhd">Mốc</div>`+snaps.map(i=>`<div style="background:var(--bg);color:var(--ink);font-weight:600">${meKey(i)===Q.base?'Đầu quý':''}</div>`).join('')+'</div>';
  h+=V({pbi:'Matrix',it:'Cột: tháng snapshot. Values: [Hạng], [Mốc], Switch values to rows. Nền và chữ: fx',x:L,y:Y.mtx+184,w:LW,h:Y.foot-16-(Y.mtx+184),inner:`<div class="t2" style="padding:16px 16px 0">Hạng qua các kỳ chốt <small>snapshot RFM cuối mỗi tháng</small></div>${sg}`});
  h+=V({pbi:'Shape: Rectangle',x:RX,y:Y.grp,w:RW,h:700-Y.grp,cls:'shape',inner:''});
  const pr=FACT_PROJECT.filter(p=>p.CustomerKey===c.CustomerKey&&p.DateKey_GhiNhan<=C).sort((a,b)=>b.DateKey_GhiNhan-a.DateKey_GhiNhan);
  h+=V({pbi:'Table',x:RX+16,y:Y.grp+16,w:RW-32,h:196,cls:'clear tb2',inner:`<div class="t2">Dự án của khách hàng</div><div class="sc">${tbl('cp',[
    {h:'Dự án',w:'22%',f:r=>r.MaDuAn,s:r=>r.MaDuAn},{h:'Ghi nhận',w:'22%',num:true,f:r=>ddmmyyyy(r.DateKey_GhiNhan),s:r=>r.DateKey_GhiNhan},
    {h:'Trạng thái',w:'56%',f:r=>r.DateKey_KHPhanHoi&&r.DateKey_KHPhanHoi<=C?dot('ok','KH phản hồi: '+r.KetQuaPhanHoi):r.DateKey_GuiMau&&r.DateKey_GuiMau<=C?dot('warn','Chờ KH phản hồi'):dot('na','Thu thập thông tin'),s:r=>r.DateKey_KHPhanHoi?2:r.DateKey_GuiMau?1:0}],pr,'Chưa có dự án.')}</div>`});
  const inv={};for(const s of FACT_SALES) if(s.CustomerKey===c.CustomerKey&&s.DateKey<=C&&(selM==null||miOf(s.DateKey)===selM)){(inv[s.SoHD]??={so:s.SoHD,d:s.DateKey,n:0,DT:0});inv[s.SoHD].n++;inv[s.SoHD].DT+=s.DoanhThu}
  const invs=Object.values(inv).sort((a,b)=>b.d-a.d), nInv=invs.length;
  h+=V({pbi:'Table',it:'Top N = 7. Lọc chéo từ biểu đồ doanh thu',x:RX+16,y:Y.grp+226,w:RW-32,h:700-Y.grp-226-16,cls:'clear tb2',inner:`<div class="t2">Hóa đơn gần nhất${selM!=null?` (lọc: tháng ${lab(selM)})`:''}${nInv>7?` <small>7 / ${nInv}</small>`:''}</div><div class="sc">${tbl('ci',[
    {h:'Số hóa đơn',w:'30%',f:r=>r.so,s:r=>r.so},{h:'Ngày',w:'24%',num:true,f:r=>ddmmyyyy(r.d),s:r=>r.d},{h:'Số mặt hàng',w:'22%',num:true,f:r=>r.n,s:r=>r.n},{h:'Doanh thu',w:'24%',num:true,f:r=>money(r.DT),s:r=>r.DT}],invs,'Không có hóa đơn.',{top:7})}</div>`});
  h+=footer('Trang 3: Hồ sơ khách hàng');
  return h;
}

/* ---------- Render, chọn, drillthrough ---------- */
function render(){
  const st=document.getElementById('stage');
  st.classList.toggle('pbi',state.pbi);
  const pt=document.getElementById('pbiT'); if(pt) pt.setAttribute('aria-pressed',String(state.pbi));
  st.innerHTML=(state.page==='dept'?pageDept():state.page==='emp'?pageEmp():pageCust())+overlay()+'<div id="tip" role="tooltip"></div><div id="ctx" role="menu"></div>';
}
function drill(page,ctx){
  state.hist.push({page:state.page,emp:state.emp,cust:state.cust,bm:state.bm});
  Object.assign(state,{page,sel:{}},ctx); render();
}
function toggleSel(obj){
  const s=state.sel, same=Object.keys(obj).every(k=>String(s[k])===String(obj[k]));
  state.sel=same?{}:obj; render();
}
const stage=()=>document.getElementById('stage');
function hideCtx(){const c=document.getElementById('ctx');if(c)c.style.display='none'}
document.addEventListener('click',ev=>{
  const t=ev.target;
  if(!t.closest('#ctx')) hideCtx();
  const ov=t.closest('[data-ov]'); if(ov){state.ov=state.ov===ov.dataset.ov?null:ov.dataset.ov;render();return}
  if(t.closest('[data-ovclose]')){state.ov=null;render();return}
  if(t.closest('[data-reset]')){state.cutSel=null;state.q=3;state.cut=Math.min(curQ().months[2],M_LAST);state.sel={};render();return}
  if(t.closest('#pbiT')){state.pbi=!state.pbi;render();return}
  const q=t.closest('[data-q]'); if(q){state.q=+q.dataset.q;if(!curQ().months.includes(state.cutSel))state.cutSel=null;state.cut=state.cutSel??Math.min(curQ().months[2],M_LAST);state.sel={};render();return}
  const c=t.closest('[data-cut]'); if(c){const v=+c.dataset.cut;state.cutSel=v;state.cut=v;state.sel={};render();return}
  if(t.closest('[data-back]')){if(!state.hist.length)return;const p=state.hist.pop()||(isMgr()?{page:'dept'}:{page:'emp',emp:state.role});Object.assign(state,p,{sel:{}});render();return}
  const g=t.closest('[data-goto]'); if(g){state.hist=[];Object.assign(state,isMgr()?{page:'dept',sel:{}}:{page:'emp',emp:state.role,sel:{}});render();return}
  const cm=t.closest('[data-ctx]'); if(cm){const [pg,key]=cm.dataset.ctx.split(':');hideCtx();drill(pg,pg==='emp'?{emp:key==='all'?'all':+key}:{cust:+key});return}
  const b=t.closest('[data-dtbtn]'); if(b&&!b.disabled){const s=state.sel;
    if(b.dataset.dtbtn==='emp') drill('emp',{emp:s.emp==='all'?'all':+s.emp}); else if(b.dataset.dtbtn==='ins') drill('emp',{emp:+s.emp}); else drill('cust',{cust:+s.cust}); return}
  const bm=t.closest('[data-bm]'); if(bm){state.bm=(+bm.dataset.bm)||null;if(state.sel.src==='chart'||state.sel.src==='table')state.sel={};render();return}
  const so=t.closest('[data-sort]'); if(so){const [id,ci]=so.dataset.sort.split(':');const cur=state.sort[id];
    state.sort[id]=cur&&cur.c===+ci?{c:+ci,d:-cur.d}:{c:+ci,d:-1};render();return}
  const mr=t.closest('[data-mrow]'); if(mr){toggleSel({src:'matrix',emp:mr.dataset.mrow==='all'?'all':+mr.dataset.mrow});return}
  const ins=t.closest('[data-ins]'); if(ins){toggleSel({src:'ins',emp:+ins.dataset.ins});return}
  const bar=t.closest('[data-cm]'); if(bar){toggleSel({src:'chart',month:+bar.dataset.cm});return}
  const row=t.closest('[data-row]'); if(row){const [tid,ck]=row.dataset.row.split(':');toggleSel({src:'table',tid,cust:+ck});return}
  // Bấm vào nền canvas = xoá lựa chọn (như Power BI)
  if(t.closest('#stage')&&!t.closest('button,select,a')&&state.sel.src){state.sel={};render()}
});
document.addEventListener('contextmenu',ev=>{
  const el=ev.target.closest('[data-dt-emp],[data-dt-cust]'); if(!el) return;
  ev.preventDefault();
  const menu=document.getElementById('ctx'), st=stage().getBoundingClientRect(), sc=st.width/1280;
  const items=[];
  if(el.dataset.dtEmp) items.push(`<button data-ctx="emp:${el.dataset.dtEmp}">Nhân viên</button>`);
  if(el.dataset.dtCust) items.push(`<button data-ctx="cust:${el.dataset.dtCust}">Hồ sơ khách hàng</button>`);
  menu.innerHTML=`<div class="h">Drill through</div>${items.join('')}`;
  menu.style.left=Math.min((ev.clientX-st.left)/sc,1280-200)+'px'; menu.style.top=Math.min((ev.clientY-st.top)/sc,720-90)+'px'; menu.style.display='block';
});
// Tooltip mặc định + visual header tooltip (ⓘ)
function placeTip(ev,html){
  const tip=document.getElementById('tip'); if(!tip) return;
  const st=stage().getBoundingClientRect(), sc=st.width/1280;
  tip.innerHTML=html; tip.style.display='block';
  let x=(ev.clientX-st.left)/sc+14, y=(ev.clientY-st.top)/sc+14;
  const w=tip.offsetWidth, h=tip.offsetHeight;
  if(x+w>1270) x-=w+28; if(y+h>710) y-=h+28;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
document.addEventListener('mousemove',ev=>{
  const hb=ev.target.closest('[data-htip]');
  if(hb){const kp=DIM_KPI[+hb.dataset.htip-1];placeTip(ev,`<div class="tx"><b>${kp.Ten}</b><br>${kp.CongThuc}</div>`);return}
  const el=ev.target.closest('[data-tt]');
  const tip=document.getElementById('tip'); if(!tip) return;
  if(!el){tip.style.display='none';return}
  const rows=el.dataset.tt.split('||').map(p=>p.split('::'));
  placeTip(ev,rows.map(r=>`<div class="rw"><span>${r[0]}</span><b>${r[1]}</b></div>`).join(''));
});
document.addEventListener('mouseleave',()=>{const t=document.getElementById('tip');if(t)t.style.display='none'},true);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){hideCtx();if(state.sel.src){state.sel={};render()}}});

function roleBar(){
  const sel=document.getElementById('roleSel');
  sel.innerHTML=SALES.map(x=>`<option value="${x.EmployeeKey}">${x.TenNV}</option>`).join('');
  if(!isMgr()) sel.value=String(state.role);
  sel.disabled=isMgr();
  document.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.role===(isMgr()?'mgr':'emp'))));
  const E=isMgr()?EMP[1]:EMP[state.role];
  document.getElementById('roleNote').innerHTML=`Đăng nhập: <b>${E.Email}</b>. ${isMgr()?'Thấy toàn phòng và báo cáo của từng nhân viên.':'Chỉ thấy báo cáo, khách hàng và dự án của chính mình.'}`;
}
function setRole(r){
  state.role=r;
  Object.assign(state,isMgr()?{page:'dept',emp:null}:{page:'emp',emp:r},{sel:{},hist:[],cust:null,bm:null});
  roleBar(); render();
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-role]'); if(!b) return;
  if(b.dataset.role==='mgr') setRole('mgr'); else setRole(isMgr()?+document.getElementById('roleSel').value:state.role)});
document.addEventListener('change',ev=>{if(ev.target.id==='roleSel') setRole(+ev.target.value)});

function fit(){
  const s=Math.min(1,(document.documentElement.clientWidth-32)/1280);
  document.getElementById('stage').style.transform=`scale(${s})`;
  const fr=document.getElementById('frame'); fr.style.width=1280*s+'px'; fr.style.height=720*s+'px';
}
window.addEventListener('resize',fit);
roleBar(); fit(); render();
</script>
